name: Deploy inset.page

# Deploys the apex site Worker (`inset-site`) from the current origin/main.
# Requires the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The `www` redirect Worker is unchanged by normal content releases and is not deployed here.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to deploy; it must equal origin/main"
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-inset-page
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            message="CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が未登録のため inset.page に公開できません。README の手順で登録するか、main から npm run deploy を実行してください。"
            echo "::error::${message}"
            echo "${message}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Require origin/main
        run: |
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse FETCH_HEAD)"
          if [ "$head" != "$main" ]; then
            echo "::error::inset.page is deployed only from origin/main. HEAD=${head} origin/main=${main}"
            exit 1
          fi
          echo "Deploying main@${head:0:12}"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run deploy:ci
      - name: Summary
        run: echo "inset.page に main@$(git rev-parse --short=12 HEAD) を公開しました。" >> "$GITHUB_STEP_SUMMARY"
