<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inset — ロードマップ / Roadmap</title>
<style>
  :root{ --bg:#fff; --fg:#1c1c1e; --mut:#6b6b70; --line:#e6e6ea; --accent:#111114;
         --chip:#f2f2f5; --chip-on:#1c1c1e; --card:#fafafb; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.7 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;}
  header{background:var(--accent);color:#fff;padding:28px 24px;}
  header .wrap{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  header h1{margin:0;font-size:22px;font-weight:700;}
  header p{margin:4px 0 0;color:#b9b9c0;font-size:14px;}
  .lang{display:flex;gap:0;border:1px solid #3a3a40;border-radius:8px;overflow:hidden;}
  .lang button{background:transparent;color:#b9b9c0;border:0;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--accent);font-weight:600;}
  main{max-width:1040px;margin:0 auto;padding:28px 24px 72px;}
  .updated{color:var(--mut);font-size:13px;margin:0 0 18px;}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px;}
  .filters button{background:var(--chip);color:var(--fg);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.15s;}
  .filters button[aria-pressed="true"]{background:var(--chip-on);color:#fff;border-color:var(--chip-on);}

  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .col{min-width:0;}
  .col > h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;color:var(--accent);}
  .col > .sub{color:var(--mut);font-size:12px;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:12px;}
  .col .empty{color:var(--mut);font-size:13px;padding:8px 0;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:0 0 12px;}
  .card .tag{display:inline-block;font-size:11px;letter-spacing:.03em;padding:2px 8px;border-radius:6px;margin:0 0 8px;
    background:#ececef;color:#3a3a40;border:1px solid #e0e0e4;}
  .card .tag.cat-feature{background:#1c1c1e;color:#fff;border-color:#1c1c1e;}
  .card .tag.cat-bug{background:#ececef;color:#3a3a40;}
  .card .tag.cat-i18n{background:#fff;color:#3a3a40;border-color:#bdbdc4;}
  .card .tag.cat-growth{background:#5b5b62;color:#fff;border-color:#5b5b62;}
  .card h3{margin:0 0 6px;font-size:15px;font-weight:600;line-height:1.45;}
  .card p{margin:0;font-size:13px;color:var(--mut);line-height:1.6;}
  .card .ref{display:inline-block;margin-top:8px;font-size:11px;color:#9a9aa0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .card .status{display:inline-block;font-size:11px;letter-spacing:.03em;padding:2px 8px;border-radius:6px;margin:0 0 8px 6px;border:1px solid;vertical-align:top;}
  .card .status.done{background:#e7f6ec;color:#1a7f3c;border-color:#bfe6cb;}
  .card .status.planned{background:#f5f5f7;color:#8a8a90;border-color:#e4e4e8;}

  .changelog{margin:56px 0 0;}
  .changelog h2{font-size:18px;margin:0 0 4px;}
  .changelog .sub{color:var(--mut);font-size:13px;margin:0 0 18px;}
  .changelog ol{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);}
  .changelog li{position:relative;padding:0 0 18px 20px;}
  .changelog li::before{content:"";position:absolute;left:-7px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .changelog .date{font-size:12px;color:var(--mut);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .changelog .ctitle{font-size:14px;}

  footer{max-width:1040px;margin:0 auto;padding:0 24px 56px;color:var(--mut);font-size:13px;}
  footer a{color:#0a63c9;}
  .loading,.error{color:var(--mut);padding:40px 0;}

  @media(max-width:820px){ .board{grid-template-columns:1fr;gap:8px;}
    .col{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;} }
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1 data-i18n="title">Inset — ロードマップ</h1>
  <p data-i18n="tagline">写真に余白（フレーム）を重ねるアプリの開発計画</p></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="ja" aria-pressed="true">日本語</button>
    <button data-lang="en" aria-pressed="false">English</button>
  </div>
</div></header>

<main>
  <p class="updated" id="updated"></p>
  <div class="filters" id="filters" role="group" aria-label="Filter"></div>
  <div class="board" id="board"><p class="loading" data-i18n="loading">読み込み中…</p></div>

  <section class="changelog" id="changelog" hidden>
    <h2 data-i18n="cl_title">これまでの歩み</h2>
    <p class="sub" data-i18n="cl_sub">主な開発マイルストーン</p>
    <ol id="changelog-list"></ol>
  </section>
</main>

<footer>
  <a href="index.html" data-i18n="back">← サポート / Support</a>
</footer>

<script>
const T = {
  ja:{ title:"Inset — ロードマップ", tagline:"写真に余白（フレーム）を重ねるアプリの開発計画",
       loading:"読み込み中…", cl_title:"これまでの歩み", cl_sub:"主な開発マイルストーン",
       back:"← サポート / Support", updated:u=>`最終更新: ${u}`, empty:"（まだありません）",
       all:"すべて", done:"実装済み", planned:"未実装",
       cat:{feature:"機能",bug:"バグ改善",i18n:"グローバル対応",growth:"グロース"},
       stage:{ now:["Now","いま進めている"], next:["Next","次に取り組む"], later:["Later","その先の構想"] } },
  en:{ title:"Inset — Roadmap", tagline:"Development plan for the photo-margin (frame) app",
       loading:"Loading…", cl_title:"Milestones", cl_sub:"Key development milestones so far",
       back:"← Support", updated:u=>`Last updated: ${u}`, empty:"(nothing yet)",
       all:"All", done:"Implemented", planned:"Planned",
       cat:{feature:"Feature",bug:"Fixes",i18n:"Global",growth:"Growth"},
       stage:{ now:["Now","In progress"], next:["Next","Up next"], later:["Later","Future"] } }
};
const STAGES = ["now","next","later"];
const CATS = ["feature","bug","i18n"];
let DATA = null, lang = "ja", filter = "all";

function pick(o){ return (o && (o[lang] || o.ja || o.en)) || ""; }

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n"); if(typeof t[k]==="string") el.textContent = t[k];
  });
  if(!DATA) return;
  document.getElementById("updated").textContent = t.updated(DATA.updated);

  // filters
  const fc = document.getElementById("filters"); fc.innerHTML = "";
  [["all",t.all],...CATS.map(c=>[c,t.cat[c]])].forEach(([key,label])=>{
    const b = document.createElement("button");
    b.textContent = label; b.setAttribute("aria-pressed", String(filter===key));
    b.onclick = ()=>{ filter = key; render(); };
    fc.appendChild(b);
  });

  // board
  const board = document.getElementById("board"); board.innerHTML = "";
  const items = DATA.items.filter(i=> filter==="all" || i.category===filter);
  STAGES.forEach(stage=>{
    const col = document.createElement("div"); col.className = "col";
    const [head, sub] = t.stage[stage];
    col.innerHTML = `<h2>${head}</h2><p class="sub">${sub}</p>`;
    const list = items.filter(i=>i.stage===stage);
    if(!list.length){ const e=document.createElement("p"); e.className="empty"; e.textContent=t.empty; col.appendChild(e); }
    list.forEach(i=>{
      const card = document.createElement("div"); card.className = "card";
      const ref = i.ref ? `<span class="ref">${i.ref}</span>` : "";
      const status = i.implemented
        ? `<span class="status done">✓ ${t.done}</span>`
        : `<span class="status planned">${t.planned}</span>`;
      card.innerHTML =
        `<span class="tag cat-${i.category}">${t.cat[i.category]||i.category}</span>${status}`+
        `<h3></h3><p></p>${ref}`;
      card.querySelector("h3").textContent = pick(i.title);
      card.querySelector("p").textContent = pick(i.note);
      col.appendChild(card);
    });
    board.appendChild(col);
  });

  // changelog
  const cl = DATA.changelog || [];
  const sec = document.getElementById("changelog");
  const ol = document.getElementById("changelog-list"); ol.innerHTML = "";
  if(cl.length){
    sec.hidden = false;
    cl.forEach(c=>{
      const li = document.createElement("li");
      li.innerHTML = `<div class="date">${c.date}</div><div class="ctitle"></div>`;
      li.querySelector(".ctitle").textContent = pick(c.title);
      ol.appendChild(li);
    });
  } else { sec.hidden = true; }
}

document.querySelectorAll(".lang button").forEach(b=>{
  b.onclick = ()=>{
    lang = b.getAttribute("data-lang");
    document.querySelectorAll(".lang button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    render();
  };
});

fetch("roadmap.json?v=" + Date.now())
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ DATA = d; render(); })
  .catch(e=>{
    document.getElementById("board").innerHTML =
      `<p class="error">ロードマップを読み込めませんでした / Could not load roadmap. (${e.message})</p>`;
  });
</script>
</body>
</html>
